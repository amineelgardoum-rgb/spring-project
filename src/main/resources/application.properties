# Prof: java -jar app.jar uses these defaults (root/empty password).
# For local dev, activate dev profile: --spring.profiles.active=dev

# ===== Database =====
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/annotationbase?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
app.jwt.secret=dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5MUCBBbm5vdGF0aW9uIFBsYXRmb3JtIDI1NiBiaXRz
app.jwt.expiration-ms=3600000

# ===== NLP Python Integration =====
nlp.python.executable=python
nlp.scripts.dir=${java.io.tmpdir}/nlp-scripts
nlp.max-concurrent-jobs=2
nlp.models.dir=${java.io.tmpdir}/nlp-models

# ===== Admin seed credentials =====
app.admin.username=admin
app.admin.password=admin